[matrix]
homeserver    = "https://matrix.example.org"
user_id       = "@geobot:example.org"
# Secrets may instead come from MATRIX_ACCESS_TOKEN / MATRIX_RECOVERY_KEY.
access_token  = "syt_REPLACE_ME"
device_id     = "REPLACE_ME"
# recovery_key = "OPTIONAL RECOVERY KEY"

[security]
# Users allowed to invite the bot ("all" = anyone, [] = nobody).
# Configured admins may always open a direct chat with the bot.
allowed_inviters = ["@admin:example.org"]
# Rooms the bot may join: room IDs, [] for none, or "all" for every room.
# Required: without it the bot refuses to start.
allowed_rooms = ["!REPLACE_ME:example.org"]
# Members of these rooms may also open a private chat with the bot.
# dm_rooms = ["!REPLACE_ME:example.org"]
# Only these users may run admin commands, also privately in a direct chat
# with the bot (!startgeo, !prefetch).
admin_users = ["@admin:example.org"]
# encryption_strategy = "identity_based"  # AllDevices | IdentityBased (default) | OnlyTrusted

[schedule]
# Matrix room where all game messages are posted.
room_id = "!REPLACE_ME:example.org"

# Times to post the daily game (HH:MM, in the configured timezone).
game_times = ["19:00"]

# Game mode: "multiple_choice" (default) or "free_guess".
#   multiple_choice: 4 country options; react 🇦🇧🇨🇩 or type !a/!b/!c/!d
#   free_guess: type any location in the DM; on every image each player
#                     duels every other, the closer guess (to the metre) wins
#                     Accepts: city, country, full address (street + postcode),
#                              or raw lat,lon coordinates.
# game_mode = "multiple_choice"

# Emoji used for the opt-in join message (free_guess + scheduled mode only).
# The bot reacts to its own "who wants to play?" message with this emoji.
# Anyone who also reacts with the same emoji receives questions via private DM.
# join_emoji = "👍"

# How many images per round (default 5).
guesses_per_round = 5

# How long (seconds) to collect answers per image.
answer_timeout_secs = 90

# Pause in seconds between images (default 15).
inter_guess_secs = 15

# Seconds before game_time to post a "starting soon" reminder.
# Set to 0 to disable.  Default: 300 (5 minutes).
reminder_before_secs = 300

# IANA timezone for scheduling.
timezone = "Europe/Berlin"

[schedule.leaderboard]
# Rankings come from duels: on every image each player meets every other
# player once, the closer guess (to the metre) wins +1, the same metre is ½
# each, and a player who joined but didn't guess loses to everyone who did.
# The monthly board adds up duel points (playing more counts). The 90-day and
# all-time boards rank by the share of duels won, once a player has this many
# images; below it they are listed apart. Nothing shifts afterwards: every
# image's result is fixed when it closes.
# min_images = 20

[sources]
# Sources to draw images from. Supported: "wikimedia", "mapillary", "local".
# The bot picks randomly from this list for each image.
# Mix sources for variety, e.g. enabled = ["mapillary", "wikimedia"]
enabled = ["mapillary"]

[sources.mapillary]
# Free client access token: register at https://www.mapillary.com/developer
access_token  = "MLY|REPLACE_ME"
# Desired search radius in metres around the seed coordinate. Mapillary's API
# hard-caps the actual search area at roughly 500 m-1.1 km per side (its bbox
# query limit) regardless of this value, so anything at or above that is
# clamped down to the maximum the API allows.
search_radius = 5000
# Optional: only seed in these ISO 3166-1 alpha-2 countries.
# countries = ["DE", "FR", "IT", "ES", "GB"]
# Difficulty. 0 (default) searches each seed city's centre. A value in km
# searches at random points up to that far around the city instead (three
# tries per city, the countryside has fewer photos): 10 reaches the suburbs,
# 30 to 50 the countryside. Photos found more than 3 km out are revealed as
# "near <city>". Images already in the cache are used up first.
# spread_km = 0

[sources.wikimedia]
# Geosearch radius in metres (default 50 000).
search_radius = 50000
# Maximum image file size in bytes (default 4 MB). Larger images are skipped.
max_image_bytes = 4194304
# Optional: only use seed locations in these ISO 3166-1 alpha-2 countries.
# Leave empty for the full world pool.
# countries = ["DE", "FR", "IT", "ES", "GB"]

# [sources.local]
# path = "/data/geo-images"
#
# The directory must contain an index.json file:
# [
#   { "file": "berlin.jpg", "country": "Germany", "region": "Europe",
#     "city": "Berlin", "attribution": "Photo by Alice" },
#   ...
# ]
# "country" must match one of the names in the built-in countries list.

[security.verification]
# Users allowed to complete first-time verification. If omitted or empty,
# an explicit allowed_inviters list is used as the fallback.
allowed_users = ["@you:matrix.org"]
# Also allow first-time verification for users sharing a joined room with the bot.
allow_users_from_joined_rooms = false
# SAS-only verification limits.
flow_timeout_secs = 300
grant_ttl_secs = 600
max_concurrent = 8

[security.admin_dm]
# Admins can open a direct chat with the bot and manage it there:
#   !admin status | verify | settings | set <key> <value> | unset <key>
# `!admin verify` starts mutual emoji (SAS) verification with you.
enabled = true
# Only accept admin commands in end-to-end encrypted direct chats.
require_encryption = true
# Only accept admin commands from devices the bot has verified (recommended
# once you and the bot have verified each other).
require_verified_device = false

# ── Result map images ─────────────────────────────────────────────────────────
# After every guess the bot posts one image: all guesses, the actual location,
# and a ranked legend. Tiles come from any XYZ tile server; missing tiles only
# leave a blank background. Keep the attribution your provider requires.
# [map]
# tile_url    = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
# attribution = "© OpenStreetMap contributors"
