[package]
name        = "geoguessr-bot"
version     = "0.1.0"
edition     = "2021"

[[bin]]
name = "geoguessr-bot"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
axum               = "0.7"
chrono             = { version = "0.4", features = ["serde"] }
chrono-tz          = "0.9"
mime               = "0.3"
mxbot-common       = { git = "https://github.com/PolynomialDivision/mxbot-common" }
rand               = "0.8"
reqwest            = { version = "0.13", features = ["json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
rusqlite           = { version = "0.40", features = ["chrono", "serde_json"] }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tiny-skia  = "0.11"
base64     = "0.22"
flate2     = "1"
image      = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ab_glyph = "0.2.32"

[dev-dependencies]
tempfile = "3"
# Config tests (src/config.rs); the version mxbot-common reads configs with.
toml     = "1"
# Router tests (src/web.rs).
tower    = { version = "0.5", features = ["util"] }

# No panic = "abort" (unlike the other bots): panics are caught on purpose in
# drawing the map and fetching its tiles (images from outside).
# Its background loops still end the bot on a panic (mxbot_common::supervise).
